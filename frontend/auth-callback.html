<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging in...</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8f3e6, #d4e8d0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #E2E8E0;
            border-top-color: #2D6A4F;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p { color: #4A5B4A; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p id="message">🌿 Logging you in with Google...</p>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const username = urlParams.get('user');
        const error = urlParams.get('error');
        
        if (error) {
            document.getElementById('message').innerHTML = '❌ Login failed. Redirecting...';
            setTimeout(() => window.location.href = 'login.html', 2000);
        } else if (token && username) {
            localStorage.setItem('token', token);
            localStorage.setItem('user', JSON.stringify({ username: username }));
            document.getElementById('message').innerHTML = '✅ Login successful! Redirecting...';
            setTimeout(() => window.location.href = 'dashboard.html', 1000);
        } else {
            document.getElementById('message').innerHTML = '⚠️ Redirecting to login...';
            setTimeout(() => window.location.href = 'login.html', 2000);
        }
    </script>
</body>
</html>
